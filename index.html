<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自嘲熊 🐻</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');

    :root {
      --cream: #fffaf2;
      --brown: #5b463d;
      --soft-brown: #8b7569;
      --pink: #e8aaa2;
      --yellow: #f4d77d;
      --line: #eadfd4;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Zen Maru Gothic", "Microsoft JhengHei", sans-serif;
      color: var(--brown);
      background:
        radial-gradient(circle at 8% 15%, rgba(244,215,125,.28) 0 75px, transparent 76px),
        radial-gradient(circle at 92% 80%, rgba(232,170,162,.22) 0 105px, transparent 106px),
        var(--cream);
      overflow-x: hidden;
    }

    .wrapper {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 22px;
      position: relative;
    }

    /* 裝飾小圓點 */
    .dot {
      position: absolute;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--yellow);
      opacity: .8;
    }
    .dot.one { top: 14%; left: 17%; }
    .dot.two { top: 27%; right: 15%; background: var(--pink); width: 8px; height: 8px; }
    .dot.three { bottom: 18%; left: 13%; background: var(--pink); width: 7px; height: 7px; }
    .dot.four { bottom: 12%; right: 20%; width: 13px; height: 13px; }

    .content {
      width: min(860px, 100%);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .title-area {
      margin-bottom: 25px;
      animation: appear .8s ease both;
    }

    .small-title {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--soft-brown);
      margin-bottom: 7px;
    }

    h1 {
      margin: 0;
      font-size: clamp(46px, 8vw, 76px);
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: 8px;
      color: var(--brown);
      text-shadow: 3px 3px 0 rgba(244,215,125,.55);
    }

    .subtitle {
      margin: 13px 0 0;
      font-size: 15px;
      color: var(--soft-brown);
      letter-spacing: 2px;
    }

    .bear-card {
      width: min(680px, 100%);
      margin: 0 auto;
      padding: 24px;
      background: rgba(255,255,255,.78);
      border: 2px solid rgba(234,223,212,.9);
      border-radius: 34px;
      box-shadow:
        0 18px 45px rgba(91,70,61,.10),
        0 4px 0 rgba(91,70,61,.04);
      animation: float-in .9s .15s ease both;
      position: relative;
    }

    .bear-card::before {
      content: "🐾";
      position: absolute;
      top: 17px;
      left: 20px;
      font-size: 25px;
      opacity: .35;
      transform: rotate(-15deg);
    }

    .bear-card::after {
      content: "♡";
      position: absolute;
      right: 24px;
      bottom: 16px;
      font-size: 30px;
      color: var(--pink);
      opacity: .55;
      transform: rotate(12deg);
    }

    .image-wrap {
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      line-height: 0;
      border: 1px solid #f0e7df;
    }

    .bear-image {
      display: block;
      width: 100%;
      height: auto;
      transition: transform .45s ease;
    }

    .bear-card:hover .bear-image {
      transform: scale(1.015);
    }

    .caption {
      margin-top: 19px;
      font-size: 14px;
      color: var(--soft-brown);
    }

    .caption strong {
      color: var(--brown);
      font-size: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 13px;
      padding: 8px 15px;
      border-radius: 999px;
      background: #fff4d7;
      border: 1px solid #f1dfac;
      font-size: 12px;
      font-weight: 700;
    }

    footer {
      margin-top: 23px;
      font-size: 12px;
      color: #a38f83;
      letter-spacing: 1px;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float-in {
      from { opacity: 0; transform: translateY(22px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 600px) {
      .wrapper { padding: 35px 15px; }
      .bear-card { padding: 13px; border-radius: 25px; }
      h1 { letter-spacing: 5px; }
      .subtitle { font-size: 13px; }
      .dot.one { left: 8%; }
      .dot.two { right: 7%; }
    }
  </style>
</head>
